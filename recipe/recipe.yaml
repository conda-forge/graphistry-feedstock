schema_version: 1

context:
  name: graphistry
  version: "0.59.3"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/graphistry-${{ version }}.tar.gz
  sha256: d5aa97cc83b46e26adf080def526f5ff7b5692e15e0c5e8ee7f58f29b868b0c2

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools
  run:
    - python >=${{ python_min }}
    - numpy
    - palettable >=3.0
    - pandas
    - lark >=1.1,<2
    - pyarrow >=0.15.0
    - requests
    - typing_extensions
    - packaging >=20.1
    - setuptools

tests:
  - python:
      imports:
        - graphistry
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: A visual graph analytics library.
  license: BSD-3-Clause
  license_file: LICENSE.txt
  homepage: https://github.com/graphistry/pygraphistry
  documentation: https://pythonhosted.org/graphistry/

extra:
  recipe-maintainers:
    - thewchan
